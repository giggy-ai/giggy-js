name: SDK CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Check examples
        run: |
          node --check examples/basic-tts.mjs
          node --check examples/streaming-tts.mjs
          node --check test/live-smoke.mjs

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify packaged SDK installs and imports
        shell: bash
        run: |
          set -euo pipefail

          package_root="$PWD"
          temp_dir="$(mktemp -d)"

          cleanup() {
            rm -rf "$temp_dir"
            rm -f "$package_root"/*.tgz
          }

          trap cleanup EXIT

          tarball="$(npm pack --silent)"

          cd "$temp_dir"

          printf '{"private":true,"type":"module"}\n' \
            > package.json

          npm install --ignore-scripts "$package_root/$tarball"

          node --input-type=module <<'NODE'
          import {
            Giggy,
            GiggyAPIError,
          } from '@giggy-ai/sdk';

          if (typeof Giggy !== 'function') {
            throw new Error('Giggy export is missing.');
          }

          if (typeof GiggyAPIError !== 'function') {
            throw new Error('GiggyAPIError export is missing.');
          }

          const client = new Giggy({
            apiKey: 'giggy_sk_test_not_real',
          });

          if (typeof client.speech.create !== 'function') {
            throw new Error('speech.create is missing.');
          }

          if (typeof client.speech.stream !== 'function') {
            throw new Error('speech.stream is missing.');
          }

          console.log('Packaged SDK imports successfully.');
          NODE

      - name: Fail if a likely real Giggy key is committed
        shell: bash
        run: |
          matches="$(
            grep -R -n -E 'giggy_sk_[A-Za-z0-9_-]{16,}' . \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=dist \
              || true
          )"

          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "Potential Giggy API key found."
            exit 1
          fi
