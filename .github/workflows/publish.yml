name: Publish SDK to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure current npm supports trusted publishing
        run: npm install --global npm@^11.21.0

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Expected tag ${expected_tag}, got ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Check whether this version is already published
        id: npm-version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          url="https://registry.npmjs.org/%40giggy-ai%2fsdk/${package_version}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${url}")"

          if [ "${status}" = "200" ]; then
            echo "already-published=true" >> "${GITHUB_OUTPUT}"
          elif [ "${status}" = "404" ]; then
            echo "already-published=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Unexpected npm registry response: ${status}."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci

      - name: Run SDK checks
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish public package
        if: steps.npm-version.outputs.already-published != 'true'
        run: npm publish --access public
